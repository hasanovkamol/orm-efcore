name: CI/CD Pipeline (.NET 10 & Angular 18)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dotnet:
    name: Build & Validate .NET 10 Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore EfCoreMastery.slnx

    - name: Build Solution
      run: dotnet build EfCoreMastery.slnx --no-restore -c Release

  build-angular:
    name: Build & Validate Angular 18 Client
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'src/EfCoreMasteryClient/package-lock.json'

    - name: Install dependencies
      working-directory: src/EfCoreMasteryClient
      run: npm ci

    - name: Build Angular Bundle
      working-directory: src/EfCoreMasteryClient
      run: npm run build

  docker-build:
    name: Build Docker Compose Containers
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-angular]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Compose Build
      run: docker compose build
